; Optional settings for ArkSplitscreen. Put this file next to xinput1_3.dll. Missing file = these defaults.
[Settings]
; 1 = fix the black lighting in splitscreen (default). 0 = leave the renderer alone.
FixSplitscreenLighting=1
; 1 = turn off the soft distance-field sun shadows while 2+ players are in (default; regular sun shadows stay).
; 0 = keep them: one player's shadows then show up in the other's half and some spots get very dark.
FixSplitscreenShadows=1
; 1 = turn off subsurface scattering (soft skin/foliage light) while 2+ players are in (default). The game runs it
; for one player's view only, which turned the other player's shadowed skin black. 0 = keep it.
SplitscreenSubsurfaceOff=1
; 1 = turn off the PvP respawn timer while 2+ players are in (default; restored when player 2 leaves).
SplitscreenNoPvPRespawnTimer=1
; 1 = build/rebuild player HUDs when someone joins or leaves mid-game (default). 0 = leave HUDs alone.
RebuildHUDs=1
; Text size in the hold-E radial menu during splitscreen. The game uses 0.70, which spills out of the ring
; (the ring itself is 0.63). Lower = smaller text. 0 = keep the game's value.
SplitscreenRadialTextScale=0.5
; How far the radial menu labels sit from the centre in splitscreen (1.0 = game default; lower = closer in).
SplitscreenRadialTextDistance=0.65
; Height of tooltips (e.g. holding a hotbar button) in splitscreen; the game squashes them to half height.
; 1.0 = game default, 2.0 = full height.
SplitscreenTooltipScaleY=2.0
; HUD size (toolbar, status icons, notifications) while 2 players are in, as a multiplier on the UI Scale from the
; game's options. 1.0 = unchanged; e.g. 1.3 = 30% bigger. Restored when player 2 leaves.
SplitscreenHUDScale=1.0
; Toolbar (hotbar) size in splitscreen; the toolbar ignores SplitscreenHUDScale. 1.0 = the game's size,
; 1.5 = 50% bigger. Applies on next launch.
SplitscreenToolbarScale=1.5
; 1 = turn on the game's console splitscreen flag (changes UI scaling, camera and sound tweaks) while 2+
; players are in. 0 = leave it off (default; this is what was tested).
SetSplitscreenFlag=0

; Testing aid: F-keys that flip a render setting in-game (press once to set, again to restore), e.g.
[ToggleKeys]
; F5=r.SSS.Scale,0

; Optional render settings applied only while 2+ players are in, restored afterwards. name=value per line,
; e.g. to trade some quality for frame rate in splitscreen:
[SplitscreenCVars]
; r.ScreenPercentage=85
